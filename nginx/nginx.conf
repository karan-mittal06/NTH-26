worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Define rate limit zone (5 requests per second per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=2r/s;
    map $http_user_agent $block_bad_user_agent {
        default 0;
        "~*curl" 1;
        "~*wget" 1;
        "~*python-requests" 1;
        "~*libwww-perl" 1;
        "~*Go-http-client" 1;
        "~*java" 1;
        "~*httpclient" 1;
        "~*http-client" 1;
        "~*scrapy" 1;
        "~*urllib" 1;
        "~*perl" 1;
        "~*php" 1;
        "~*pycurl" 1;
        "~*http_request2" 1;
        "~*mechanize" 1;
        "~*node-fetch" 1;
        "~*okhttp" 1;
        "~*apache-httpclient" 1;
        "~*winhttp" 1;
        "~*wget2" 1;
        "~*lwp::simple" 1;
        "~*python-urllib" 1;
        "~*python-httpx" 1;
        "~*httpx" 1;
        "~*axios" 1;
        "~*PostmanRuntime" 1;
    }

    server {
        listen 80;
        server_name nth-backend.api.credenz.co.in;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name nth-backend.api.credenz.co.in nth25;
        server_tokens off; # Hide Nginx version

        ssl_certificate /etc/letsencrypt/live/nth-backend.api.credenz.co.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nth-backend.api.credenz.co.in/privkey.pem;
        # include /etc/letsencrypt/options-ssl-nginx.conf;
        # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # Global User-Agent Blocking
        if ($block_bad_user_agent) {
            return 403;
        }

        # Allow only specific origins
        set $allowed_origin "";
        if ($http_origin ~* "^https://(nth\.credenz\.co\.in)$") {
            set $allowed_origin "true";
        }

        # Rate limit API requests
        location /backend/server/ {
            limit_req zone=api_limit burst=20 nodelay;
            # if ($request_method = 'POST') {
            #     add_header 'Access-Control-Allow-Origin' 'https://nthtesting.credenz.co.in' always;
            #     add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            #     add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            #     add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
            # }
            # if ($request_method = 'GET') {
            #     add_header 'Access-Control-Allow-Origin' 'https://nthtesting.credenz.co.in' always;
            #     add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            #     add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            #     add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
            # }
            if ($allowed_origin = "") {
                return 403;
            }
            proxy_pass http://nth-26-backend-1:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
        }

        location /superusers-admin {
            allow 100.103.1.114; # Restrict access to Tailscale VPN 
            allow 100.98.153.106;
            allow 100.70.217.108;
            allow 100.102.31.88;
            allow 100.104.208.6;
            allow 100.123.196.105;
            deny all;
            proxy_pass http://nth-26-admin-1:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
        }

        location /api/ {
            allow 100.103.1.114; # Restrict access to Tailscale VPN 
            allow 100.98.153.106;
            allow 100.70.217.108;
            allow 100.102.31.88;
            allow 100.104.208.6;
            allow 100.123.196.105;
            deny all;
            proxy_pass http://nth-26-admin-1:4000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
        }

        location /_next/static/ {
            proxy_pass http://nth-26-admin-1:4000/_next/static/;
            proxy_cache_valid 200 60;
            access_log off;
            expires 60;
            add_header Cache-Control "public, max-age=60, must-revalidate";
        }

        location /nth-logo.png {
            proxy_pass http://nth-26-admin-1:4000/nth-logo.png;
        }

        # Serve static files
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # Serve static files (including GIF)
        location /rickroll-rick.gif {
            root /usr/share/nginx/html;
        }

        # Custom 404 page returning '905'
        error_page 404 /html2;
        location = /html2 {
            root /usr/share/nginx/html;
            default_type text/plain;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
